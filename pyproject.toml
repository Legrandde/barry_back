[project]
name = "barry-back"
version = "0.1.0"
description = "API FastAPI du mini CMS du portfolio d'Alhassane Barry"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "imageio-ffmpeg>=0.6.0",
    "maxminddb>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
